[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helicopter-rul"
version = "1.0.0"
authors = [
  { name="Mridul Sharma" },
]
description = "Prediction of Remaining Useful Life (RUL) and Health Assessment for Sikorsky S-76A/C+ Helicopter Turboshaft Engines"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "streamlit>=1.28.0",
]

[project.scripts]
helicopter-pipeline = "src.run_pipeline:main"
helicopter-main = "main:main"
